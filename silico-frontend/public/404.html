    <meta charset="UTF-8">
    <script>

      (function(){
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          '/' + (l.pathname + l.search + l.hash).replace(/^\//, '')
        );
      })();
    </script>
    <meta http-equiv="refresh" content="0;URL='/'">
